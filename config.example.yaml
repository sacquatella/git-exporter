# Relative paths are resolved from this file's directory.
output: ./export

projects:
  - name: documentation
    source: https://github.com/organization/documentation.git
    ref: main
    username: git
    token_env: DOCS_GIT_TOKEN

  - name: internal
    source: git@gitlab.example.com:team/documentation.git
    ref: main
    ssh_key: ./keys/id_ed25519
    # Export this variable with the encrypted key's passphrase before running the CLI.
    # This is the environment variable name, not the passphrase. Omit for unencrypted keys.
    ssh_passphrase_env: DOCS_SSH_PASSPHRASE
    site_url_template: "{repo_url}/-/blob/{commit}/{path}"

  - name: local
    source: ../my-project
    # Defaults to HEAD; origin is used to build GitHub/GitLab links.
    # Without origin, provide an absolute template:
    site_url_template: "https://git.example.com/team/my-project/blob/{commit}/{path}"
